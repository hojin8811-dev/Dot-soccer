<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>v35 픽셀 도트 치비 — 스프라이트 랩</title>
<style>
  body { margin: 0; background: #16241c; color: #cfe; font: 11px system-ui, sans-serif; }
  .row { display: flex; gap: 6px; padding: 6px 10px; align-items: flex-end; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell canvas { display: block; background: #2f7d3b; image-rendering: pixelated; }
  .lab { font-size: 9px; color: #9fc; padding-top: 2px; }
  h3 { margin: 8px 10px 0; font-size: 12px; color: #c8f169; }
</style>
</head>
<body>
<h3>헤어 10종 (앞 · 옆 · 뒤)</h3>
<div class="row" id="hair"></div>
<h3>달리기 4프레임 (옆 · 앞 · 뒤)</h3>
<div class="row" id="run"></div>
<h3>슛 3프레임 · 태클 · 다이빙 · 점프 · 세리머니</h3>
<div class="row" id="pose"></div>
<h3>유니폼 · 액세서리 · 피부톤</h3>
<div class="row" id="kit"></div>
<script src="../../js/data.js"></script>
<script src="../../js/pixel_player.js"></script>
<script>
var P = DS.PIXEL;
var SC = 4;
function cell(host, cv, label) {
  var d = document.createElement('div'); d.className = 'cell';
  var c = document.createElement('canvas');
  c.width = cv.width * SC; c.height = cv.height * SC;
  var x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.drawImage(cv, 0, 0, c.width, c.height);
  d.appendChild(c);
  var l = document.createElement('div'); l.className = 'lab'; l.textContent = label; d.appendChild(l);
  host.appendChild(d);
}
var base = { kit: 'home', hair: 'spiky', hairColor: '#23262e', skin: 1, acc: 'none' };
var styles = ['spiky', 'buzz', 'undercut', 'swoop', 'wavy', 'ponytail', 'afro', 'mohawk', 'braids', 'silver'];
styles.forEach(function (st) {
  ['down', 'side', 'up'].forEach(function (dir) {
    var lk = Object.assign({}, base, { hair: st, hairColor: st === 'silver' ? '#cfd3d6' : '#23262e' });
    cell(document.getElementById('hair'), P.render(lk, dir, 'idle', 0, 0), st + '/' + dir);
  });
});
[0, 1, 2, 3].forEach(function (f) {
  ['side', 'down', 'up'].forEach(function (dir) {
    cell(document.getElementById('run'), P.render(base, dir, 'run', f, 0), dir + ' f' + f);
  });
});
['kick', 'tackle', 'dive', 'jump', 'celebrate'].forEach(function (pz) {
  [0, 1, 2].forEach(function (f) {
    cell(document.getElementById('pose'), P.render(base, 'side', pz, f, 0), pz + ' f' + f);
  });
});
[['home', 'none'], ['away', 'none'], ['gk', 'none'], ['gk2', 'none'], ['ref', 'none'],
 ['home', 'glasses'], ['away', 'shades'], ['home', 'headband'], ['away', 'glasses']].forEach(function (k) {
  var lk = Object.assign({}, base, { kit: k[0], acc: k[1] });
  cell(document.getElementById('kit'), P.render(lk, 'down', 'idle', 0, 0), k[0] + '/' + k[1]);
});
[0, 1, 2, 3].forEach(function (sk) {
  var lk = Object.assign({}, base, { skin: sk, hair: 'spiky', hairColor: '#6b4423' });
  cell(document.getElementById('kit'), P.render(lk, 'down', 'idle', 0, 0), 'skin' + sk);
});
</script>
</body>
</html>
