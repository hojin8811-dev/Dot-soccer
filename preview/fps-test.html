<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>fps-test</title>
<style>body{margin:0;background:#0b1020;color:#cfe;font:14px system-ui;padding:12px}canvas{display:block;width:300px;height:200px;background:#123}</style>
</head><body>
<div id="out">측정 중…</div>
<canvas id="c"></canvas>
<script src="../js/vendor/three.min.js?v=34"></script>
<script>
var r, w, d, n1 = 0, n2 = 0, t0 = performance.now(), rafFps = 0;
function raf() { n1++; requestAnimationFrame(raf); }
requestAnimationFrame(raf);
r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(300, 200, false);
var sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(50, 1.5, 0.1, 100);
cam.position.z = 3;
var cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x44aa88 }));
sc.add(cube); sc.add(new THREE.DirectionalLight(0xffffff, 2)); sc.add(new THREE.AmbientLight(0xffffff, 0.4));
function loop() { n2++; cube.rotation.x += 0.01; cube.rotation.y += 0.013; r.render(sc, cam); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
setInterval(function () {
  var now = performance.now(), dt = (now - t0) / 1000;
  rafFps = n1 / dt;
  document.getElementById('out').textContent = 'rAF ' + rafFps.toFixed(1) + 'fps · WebGL ' + (n2 / dt).toFixed(1) + 'fps · dpr ' + devicePixelRatio;
  n1 = 0; n2 = 0; t0 = now;
}, 1000);
</script>
</body></html>
