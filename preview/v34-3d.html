<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07130f">
<title>꼬마일레븐 FC v34 — Three.js 3D 구장 · 3D 치비 선수 데모</title>
<style>
  :root{
    --ink:#eef4f1; --dim:#9fb4ad; --gold:#ffd45e; --red:#e8453c; --blue:#3f7bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#050c0a;color:var(--ink);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  #stage{position:fixed;inset:0}
  canvas#pitch{display:block;width:100%;height:100%;outline:none}
  .hud{position:fixed;inset:0;pointer-events:none;padding:calc(8px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .score{display:flex;align-items:center;gap:8px;background:rgba(6,18,14,.72);border:1px solid rgba(255,255,255,.12);
    border-radius:12px;padding:5px 9px;backdrop-filter:blur(7px);box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .team{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:-.3px}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  .dot.h{background:var(--red)} .dot.a{background:var(--blue)}
  .num{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;padding:0 4px}
  .colon{opacity:.5;font-weight:700}
  .clock{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;border-left:1px solid rgba(255,255,255,.14);padding-left:8px;font-weight:700}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .badge{background:rgba(6,18,14,.72);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:4px 8px;font-size:10.5px;
    color:var(--dim);backdrop-filter:blur(7px);font-weight:700;letter-spacing:.2px}
  .badge b{color:var(--ink);font-variant-numeric:tabular-nums}
  .badge b.ok{color:#6ef2a3}
  .bottom{display:flex;flex-direction:column;align-items:center;gap:8px}
  .ticker{font-size:11px;color:#d8efd9;background:rgba(6,18,14,.6);border-radius:9px;padding:3px 10px;opacity:0;transition:opacity .25s;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ticker.on{opacity:1}
  .views{pointer-events:auto;display:flex;gap:4px;background:rgba(6,18,14,.74);border:1px solid rgba(255,255,255,.13);
    border-radius:13px;padding:4px;backdrop-filter:blur(9px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .views button{appearance:none;border:0;background:transparent;color:var(--dim);font:inherit;font-size:11.5px;font-weight:800;
    padding:7px 13px;border-radius:9px;letter-spacing:-.2px;transition:background .15s,color .15s;cursor:pointer}
  .views button.on{background:linear-gradient(180deg,#2ea36a,#1c7a4c);color:#fff;box-shadow:0 2px 8px rgba(46,163,106,.4)}
  .flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;
    letter-spacing:-1px;color:#fff;text-shadow:0 6px 26px rgba(0,0,0,.6),0 0 30px var(--gold);opacity:0;transform:scale(.7);
    pointer-events:none;transition:opacity .18s,transform .18s}
  .flash.on{opacity:1;transform:scale(1)}
  .flash span{background:linear-gradient(90deg,#ffe07a,#ff9d3d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{position:fixed;left:12px;bottom:calc(58px + env(safe-area-inset-bottom));font-size:9.5px;color:#7f968f;letter-spacing:.4px}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050c0a;color:var(--dim);font-size:12px;z-index:20;transition:opacity .4s}
  .loading.off{opacity:0;pointer-events:none}
  @media (orientation:portrait){ .views button{padding:7px 10px} .flash{font-size:34px} }
</style>
</head>
<body>
<div id="stage"><canvas id="pitch"></canvas></div>

<div class="hud">
  <div class="top">
    <div class="score">
      <span class="team"><i class="dot h"></i>꼬마일레븐</span>
      <span class="num" id="sA">0</span><span class="colon">:</span><span class="num" id="sB">0</span>
      <span class="team"><i class="dot a"></i>청주 UTD</span>
      <span class="clock" id="clock">0'</span>
    </div>
    <div class="right">
      <div class="badge"><b id="fps">--</b> fps</div>
      <div class="badge">3D 치비 <b>22</b>명 · WebGL</div>
    </div>
  </div>

  <div class="bottom">
    <div class="ticker" id="ticker"></div>
    <div class="views" id="views">
      <button data-view="broadcast" class="on">중계뷰</button>
      <button data-view="full">전체뷰</button>
      <button data-view="closeup">접사뷰</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"><span>GOAL!</span></div>
<div class="tag">꼬마일레븐 FC · v34 3D ENGINE DEMO</div>
<div class="loading" id="loading">3D 구장을 세우는 중…</div>

<script>
  window.__v34Errors = [];
  window.addEventListener('error', function (e) { window.__v34Errors.push(String(e.message || e.error || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + ((e.error && e.error.stack) || '')); });
  window.addEventListener('unhandledrejection', function (e) { window.__v34Errors.push('promise:' + e.reason); });
</script>
<script src="../js/vendor/three.min.js?v=34&b=2"></script>
<script src="../js/render3d.js?v=34&b=2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('pitch');
  var elA = $('sA'), elB = $('sB'), elClock = $('clock'), elFps = $('fps'), elTicker = $('ticker'), elFlash = $('flash');
  var lastFlash = 0, tickT = 0;

  var demo = Render3D.create(canvas, {
    onHud: function (d) {
      elA.textContent = d.score[0];
      elB.textContent = d.score[1];
      var mm = Math.floor(d.clock);
      elClock.textContent = (mm >= 90 ? '90+' : mm) + "'";
      elFps.textContent = d.fps;
      elFps.className = d.fps >= 50 ? 'ok' : '';
      if (d.event) { elTicker.textContent = d.event; elTicker.classList.add('on'); }
      else elTicker.classList.remove('on');
      if (d.flash > 0.06) { elFlash.classList.add('on'); }
      else elFlash.classList.remove('on');
    }
  });
  window.__v34 = demo;
  demo.start();

  var views = document.querySelectorAll('#views button');
  Array.prototype.forEach.call(views, function (b) {
    b.addEventListener('click', function () {
      demo.setView(b.getAttribute('data-view'));
      Array.prototype.forEach.call(views, function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    });
  });
  var q = new URLSearchParams(location.search);
  var v = q.get('view');
  if (v) {
    demo.setView(v);
    Array.prototype.forEach.call(views, function (x) {
      x.classList.toggle('on', x.getAttribute('data-view') === v);
    });
  }
  var pause = q.get('pause');
  if (pause === '1') demo.togglePause();

  /* 모바일 844×390 실측 모드: 화면을 그 크기 박스로 고정 (검수용) */
  var sz = q.get('size');
  if (sz) {
    var wh = sz.split('x'), W = parseInt(wh[0], 10), H = parseInt(wh[1], 10);
    var stage = document.getElementById('stage'), hud = document.querySelector('.hud');
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    hud.style.width = W + 'px'; hud.style.height = H + 'px';
    document.documentElement.style.background = '#000';
  }

  setTimeout(function () { $('loading').classList.add('off'); }, 320);

  /* 콘솔 점검용: 1초마다 실측 지표 */
  setInterval(function () {
    var s = demo.stats();
    window.__v34Stats = s;
    document.title = 'v34 3D ' + s.fps + 'fps · ' + s.calls + ' calls';
  }, 1000);
})();
</script>
</body>
</html>
