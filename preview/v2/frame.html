<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도트싸커 v2 · 390×844 검증 프레임</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; }
  body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  iframe { width: 390px; height: 844px; border: 1px solid #444; background: #000; }
</style>
</head>
<body>
<iframe id="frame"></iframe>
<script>
/* 390×844 뷰포트 검증용 프레임 + 콘솔 오류 수집기 */
(function () {
  var f = document.getElementById('frame');
  /* 캐시 회피: 매번 새 쿼리로 index.html 로드 */
  f.src = '../../index.html?f=' + Date.now();
  f.addEventListener('load', function () {
    var w = f.contentWindow;
    w.__errs = [];
    w.addEventListener('error', function (e) { w.__errs.push('ERR ' + (e.message || e.type)); });
    w.addEventListener('unhandledrejection', function (e) { w.__errs.push('REJ ' + e.reason); });
  });
  window.errors = function () {
    try { return (f.contentWindow.__errs || []).slice(); } catch (e) { return ['x']; }
  };
})();
</script>
</body>
</html>
