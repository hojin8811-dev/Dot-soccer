<meta name="description" content="100% 오리지널 축구 구단 경영 RPG. v22는 리그를 1부·2부 각 20팀(총 40팀)으로 나누고, 우리 구단은 동(브론즈) 18명으로 2부에서 출발한다. 38라운드 뒤 1~2위 자동 승격과 3~6위 승격 플레이오프, 1부 18~20위 강등이 시즌 결산에 반영되고, 1부에 오르면 중계권·스폰서 수입이 오른다. 벤치가 7명으로 늘고 경기당 교체는 5회, 전술 카드는 카드마다 고유한 전략 일러스트로 표시된다.">
